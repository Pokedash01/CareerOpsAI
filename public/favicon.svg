<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#93C5FD"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Squircle Base with Gradient and Border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#60A5FA" stroke-width="2" filter="url(#glow)"/>

  <!-- Briefcase Handle -->
  <path d="M24 21 V18 C24 15.8 25.8 14 28 14 H36 C38.2 14 40 15.8 40 18 V21" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Briefcase Body -->
  <rect x="14" y="21" width="36" height="26" rx="5" fill="#FFFFFF" fill-opacity="0.15" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Horizontal Latch Band -->
  <path d="M14 31 H50" stroke="#FFFFFF" stroke-width="2.5" stroke-opacity="0.9"/>
  <rect x="28" y="29" width="8" height="6" rx="2" fill="#FFFFFF"/>

  <!-- AI Sparkle / Dynamic Star on Top Right -->
  <path d="M47 8 Q47 15 54 15 Q47 15 47 22 Q47 15 40 15 Q47 15 47 8 Z" fill="url(#sparkleGrad)"/>
  <circle cx="47" cy="15" r="1.5" fill="#1D4ED8"/>
</svg>
