name: CareerOps 24/7 Autonomous Alert Trigger

on:
  schedule:
    # Run every 4 hours automatically around the clock
    - cron: '0 */4 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  trigger-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger CareerOps Webhook
        env:
          APP_URL: ${{ secrets.CAREEROPS_APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "CAREEROPS_APP_URL secret is not set. Please set it in Repository Secrets to your deployed Cloud Run or Render URL."
            exit 1
          fi
          echo "Dispatching webhook to $APP_URL/api/cron/trigger..."
          curl -s -f -X GET "$APP_URL/api/cron/trigger" || curl -s -f -X POST "$APP_URL/api/cron/trigger"
          echo "Webhook successfully dispatched!"
